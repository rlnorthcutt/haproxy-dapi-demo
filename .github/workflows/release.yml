name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build and package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p build dist
          go build -trimpath -ldflags "-s -w -X main.version=${{ github.ref_name }}" -o build/dapi-demo ./cmd/dapi-demo
          chmod +x build/dapi-demo
          tar -C build -czf "dist/dapi-demo_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz" dapi-demo

      - uses: actions/upload-artifact@v4
        with:
          name: dapi-demo_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/*
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

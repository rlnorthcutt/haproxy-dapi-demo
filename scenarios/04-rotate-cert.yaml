id: 04-rotate-cert
title: Rotate a certificate · staged
category: storage
reload: true
description: |
  The storage API lets you upload certificate bundles without touching the
  filesystem directly. We upload api-2026.pem, then stage the rotation by
  pointing the frontend at the new cert — all via REST. One reload completes
  the switch. No SSH, no file copy, no container restart.

prereqs:
  - reset

steps:
  - title: List current certificates
    explain: The storage endpoint shows all certs known to the DPA. Our baseline has api-2025.pem.
    run: curl -su $AUTH "$API/services/haproxy/storage/ssl_certificates" | python3 -m json.tool

  - title: Upload api-2026.pem
    explain: We POST the cert bundle as multipart/form-data. The DPA stores it and makes it available for binding.
    run: |
      curl -sX POST -u $AUTH \
        -F 'file=@/etc/haproxy/certs/api-2026.pem' \
        "$API/services/haproxy/storage/ssl_certificates" | python3 -m json.tool

  - title: Open a transaction and update the HTTPS frontend
    explain: Changing which cert a frontend uses requires a config transaction and reload.
    run: |
      VER=$(curl -su $AUTH $HAP/configuration/version)
      TX=$(curl -sX POST -u $AUTH "$HAP/transactions?version=$VER" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
      echo "Transaction: $TX"
      curl -sX PUT -u $AUTH \
        -H 'Content-Type: application/json' \
        "$HAP/configuration/frontends/fe_https?transaction_id=$TX" \
        -d '{"name":"fe_https","binds":[{"name":"fe_https_bind","address":"*","port":443,"ssl":true,"ssl_certificate":"/etc/haproxy/certs/api-2026.pem"}]}' | python3 -m json.tool

  - title: Commit the transaction
    explain: HAProxy reloads and the new cert is live. The old cert is still on disk but no longer in use.
    run: |
      VER=$(curl -su $AUTH $HAP/configuration/version)
      TX=$(curl -sX POST -u $AUTH "$HAP/transactions?version=$VER" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
      curl -sX PUT -u $AUTH "$HAP/transactions/$TX" | python3 -m json.tool

  - title: Verify the new cert is served
    explain: Connect to the HTTPS frontend and check the certificate subject. It should show 2026.
    run: |
      curl -sk https://haproxy/ -o /dev/null -w "%{ssl_verify_result} %{num_connects}\n"

verify:
  - run: curl -su $AUTH "$API/services/haproxy/storage/ssl_certificates"
    contains: "api-2026"

cleanup:
  - reset

id: drain-server
title: Drain a server via runtime API
category: runtime
reload: false
description: |
  Set a server to maintenance mode via the runtime API. Existing connections
  drain gracefully; new requests skip the server. No transaction, no reload.
  This is how you pull a backend for deployment without dropping traffic.

  The runtime API in DPA v3 uses the same path convention as the config API:
  the backend name is a path segment (/runtime/backends/{name}/servers)
  rather than a query parameter.

steps:
  - title: Show current server states
    explain: The runtime API exposes live server health and admin state — no transaction needed, this is read directly from the running HAProxy process.
    run: curl -su $AUTH "$API/services/haproxy/runtime/backends/be_app/servers" | python3 -m json.tool

  - title: Set web2 to maintenance mode
    explain: Setting admin_state to maint immediately stops new connections to web2. Existing sessions complete normally — zero dropped requests.
    run: |
      curl -sX PUT -u $AUTH \
        -H 'Content-Type: application/json' \
        "$API/services/haproxy/runtime/backends/be_app/servers/web2" \
        -d '{"admin_state":"maint"}' | python3 -m json.tool

  - title: Verify only web1 gets traffic
    explain: All four requests should land on web1. Web2 is drained with no reload required.
    run: |
      for i in 1 2 3 4; do
        curl -s http://haproxy/ | grep -o 'backend-[0-9]'
      done

  - title: Re-enable web2
    explain: Restore web2 to ready state. New connections resume immediately — again, no reload.
    run: |
      curl -sX PUT -u $AUTH \
        -H 'Content-Type: application/json' \
        "$API/services/haproxy/runtime/backends/be_app/servers/web2" \
        -d '{"admin_state":"ready"}' | python3 -m json.tool

verify:
  - run: curl -su $AUTH "$API/services/haproxy/runtime/backends/be_app/servers/web2"
    contains: '"admin_state":"ready"'

name: dapi-demo

networks:
  dapi-net:
    driver: bridge

services:
  haproxy:
    image: ghcr.io/haproxytech/haproxy-docker-alpine:s6-latest
    container_name: haproxy
    ports:
      - "18080:80"
      - "18443:443"
      - "5555:5555"
      - "18404:8404"
    volumes:
      - ./haproxy:/usr/local/etc/haproxy:z
    networks:
      - dapi-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://admin:haproxypwd@localhost:5555/v3/info > /dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s
    restart: unless-stopped

  backend-1:
    image: nginxdemos/hello
    container_name: backend-1
    hostname: backend-1
    networks:
      - dapi-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend-2:
    image: nginxdemos/hello
    container_name: backend-2
    hostname: backend-2
    networks:
      - dapi-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend-3:
    image: nginxdemos/hello
    container_name: backend-3
    hostname: backend-3
    networks:
      - dapi-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 3

  dapi-client:
    image: alpine:latest
    container_name: dapi-client
    command: >
      sh -c "apk add --no-cache curl jq python3 py3-requests > /dev/null 2>&1 &&
             echo 'dapi-client ready' &&
             tail -f /dev/null"
    volumes:
      - ./haproxy/staging:/staging:ro,z
      - ./examples/python-registration:/examples:ro,z
    networks:
      - dapi-net
    depends_on:
      haproxy:
        condition: service_healthy
    restart: unless-stopped

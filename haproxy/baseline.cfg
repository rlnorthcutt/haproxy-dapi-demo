global
    log stdout format raw local0
    stats socket /var/run/haproxy-runtime-api.sock mode 660 level admin expose-fd listeners
    stats timeout 30s
    user root

userlist controller
    user admin insecure-password haproxypwd

defaults
    mode http
    log global
    option httplog
    option dontlognull
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend fe_main
    bind :80
    use_backend %[path,map_beg(/usr/local/etc/haproxy/maps/routing.map,be_app)]
    default_backend be_app

frontend fe_https
    bind :443 ssl crt /usr/local/etc/haproxy/certs/api-2025.pem
    default_backend be_app

frontend stats
    bind :8404
    stats enable
    stats uri /stats
    stats refresh 10s
    no log

backend be_app
    balance roundrobin
    option httpchk GET /
    server web1 backend-1:80 check
    server web2 backend-2:80 check

backend be_canary
    balance roundrobin
    option httpchk GET /
    server canary1 backend-3:80 check
